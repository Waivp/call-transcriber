name: Transcribe calls (free Whisper, live)

# Live mode: one run stays up ~5.5 h, checks for new calls every 1-2 minutes, then starts the
# next run itself. The cron is only a safety net in case the chain ever breaks.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Whisper model (small / medium / large-v3-turbo)"
        default: "large-v3-turbo"

concurrency:
  group: call-transcriber
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      QUEUE_URL: ${{ secrets.QUEUE_URL }}
      HOOK_URL: ${{ secrets.HOOK_URL }}
      WHISPER_MODEL: ${{ github.event.inputs.model || 'large-v3-turbo' }}
      WHISPER_LANG: en
      WHISPER_BEAM: "5"
      LIVE: "1"
      TIME_BUDGET_SEC: "19800"
      MAX_CALLS: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}-v1
      - run: pip install -r requirements.txt
      - run: python transcribe.py
      - name: Start the next live run
        if: success() && env.QUEUE_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run transcribe.yml --repo ${{ github.repository }} -f model=${{ env.WHISPER_MODEL }}
